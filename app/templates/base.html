<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maintenance Desk — {% block title %}{% endblock %}</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen">
<header class="bg-slate-900 text-white px-6 py-4 flex items-center justify-between">
  <a href="/queue" class="text-xl font-bold">🔧 Maintenance Desk</a>
  <nav class="space-x-4 text-sm">
    <a href="/queue" class="hover:underline">Approval queue</a>
    <a href="/simulate" class="bg-blue-600 px-3 py-1.5 rounded hover:bg-blue-500">Simulate tenant message</a>
    {% if authed %}<a href="/logout" class="hover:underline text-slate-300">Log out</a>{% endif %}
  </nav>
</header>
<main class="max-w-4xl mx-auto px-4 py-6">
  {% block content %}{% endblock %}
</main>
</body>
</html>
