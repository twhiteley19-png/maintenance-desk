{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto bg-white rounded shadow p-6 mt-10">
  <h1 class="text-xl font-bold mb-4">🔧 Manager login</h1>
  {% if error %}<p class="bg-red-100 text-red-700 px-3 py-2 rounded mb-4 text-sm">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <label class="block text-sm font-bold mb-1">Password</label>
    <input type="password" name="password" autofocus class="w-full border rounded p-2 mb-4">
    <button class="bg-slate-900 text-white px-4 py-2 rounded w-full hover:bg-slate-700">Log in</button>
  </form>
</div>
{% endblock %}
